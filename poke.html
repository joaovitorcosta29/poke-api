<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main>
      <div class="titulo-linha">
        <img src="../imagens/icon.png" alt="Pokeball" class="icone" />
        <h1>Pokédex</h1>
      </div>

      <form class="form">
        <input
          type="text"
          class="pesquisa"
          placeholder="Nome ou número"
          autocomplete="off"
          required
        />
        <button type="submit">Buscar</button>
      </form>

      <section class="card">
        <img alt="Imagem do Pokémon" class="imagem-pokemon" />

        <div class="painel">
          <h2>
            <span class="numero-pokemon"></span>
            <span class="nome-pokemon"></span>
          </h2>

          <div class="tipos"></div>

          <div class="info">
            <p class="medidas">
              <span class="altura"></span> · <span class="peso"></span>
            </p>

            <ul class="status">
              <li>
                <span>HP</span>
                <span class="status-valor hp"></span>
                <span class="barra"><span class="barra-cheia" data-barra="hp"></span></span>
              </li>
              <li>
                <span>Ataque</span>
                <span class="status-valor ataque"></span>
                <span class="barra"><span class="barra-cheia" data-barra="attack"></span></span>
              </li>
              <li>
                <span>Defesa</span>
                <span class="status-valor defesa"></span>
                <span class="barra"><span class="barra-cheia" data-barra="defense"></span></span>
              </li>
              <li>
                <span>Atq. Esp.</span>
                <span class="status-valor atq-esp"></span>
                <span class="barra"><span class="barra-cheia" data-barra="special-attack"></span></span>
              </li>
              <li>
                <span>Def. Esp.</span>
                <span class="status-valor def-esp"></span>
                <span class="barra"><span class="barra-cheia" data-barra="special-defense"></span></span>
              </li>
              <li>
                <span>Velocidade</span>
                <span class="status-valor velocidade"></span>
                <span class="barra"><span class="barra-cheia" data-barra="speed"></span></span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <div class="navegacao">
        <button type="button" class="botao-anterior">&lt; Anterior</button>
        <button type="button" class="botao-proximo">Próximo &gt;</button>
      </div>
    </main>

    <script src="../js/poke.js"></script>
  </body>
</html>
